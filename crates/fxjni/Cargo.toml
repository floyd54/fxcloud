[package]
name = "fxjni"
version = "0.1.0"
edition = "2021"
description = "JNI bridge: the Android app's FxCore over the fxcffi C ABI (phase 7)"
license = "AGPL-3.0-or-later"

# Client-side only, like its siblings: never a server dependency. The
# server stays key-blind and the suite's dependency grep covers this
# crate by name (fxcffi|fxcjni - extended when this crate landed).

[lib]
# The Android app loads the cdylib (libfxcloud.so, concepts/android.md);
# the rlib keeps host-side tests and `cargo test --workspace` able to
# link the same code.
name = "fxcloud"
crate-type = ["rlib", "cdylib"]

[dependencies]
fxcffi = { path = "../fxcffi" }
#0.21 is the classic API (JNIEnv with new_string/throw_new/convert_byte_array);
#0.22 split it into Env/EnvUnowned - revisit when the app needs a newer JNI.
jni = "0.21"
# Glue-level parsing only (the /api/keys/me payload): no crypto lives
# here - the JSON is our own server's (concepts/android.md A3).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
