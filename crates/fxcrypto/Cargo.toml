[package]
name = "fxcrypto"
version = "0.1.0"
edition = "2021"
description = "fxcloud client-side crypto core (FXE1, key records, envelopes) - deliberately NOT a dependency of the server binary"
license = "AGPL-3.0-or-later"

# Client-side only: this crate must never enter the fxcloud server's
# dependency graph (the server stays key-blind; ENCRYPTION.md 8). The
# suite pins that with a dependency-section grep.

[dependencies]
aes-gcm = "0.10"
# rand0.10 matches the elliptic-curve/p256 stack in this lockfile (the
# ECDH paths take an RngCore of exactly that generation).
rand = "0.10"
argon2 = "0.5"
hkdf = "0.13"
sha2 = "0.11"
# X25519 first, P-256 fallback (DECISION 1). getrandom is not part of
# either default feature set but both crates' key generation needs it.
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
p256 = { version = "0.14", features = ["ecdh", "pkcs8", "getrandom"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
