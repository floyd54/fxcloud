<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fxcloud</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">fx<span>cloud</span></div>
    <div class="spacer"></div>
    <span class="storage" id="storage-label" title="storage used of quota"></span>
    <span class="user" id="user-label"></span>
    <button id="logout-btn" type="button">Sign out</button>
  </header>

  <main class="container">
    <div class="breadcrumb" id="breadcrumb"></div>

    <div class="toolbar">
      <button class="btn" id="new-folder-btn">＋ New folder</button>
      <button class="btn" id="upload-btn">⬆ Upload file</button>
      <button class="btn secondary" id="upload-folder-btn">📁 Upload folder</button>
      <input type="file" id="file-input" style="display:none" multiple />
      <input type="file" id="folder-input" webkitdirectory multiple style="display:none" />
      <div class="grow"></div>
    </div>

    <div class="dropzone" id="dropzone">
      Drop files <strong>or whole folders</strong> here to upload, or use the
      upload buttons above.
    </div>

    <div class="upload-status" id="upload-status" style="display:none"></div>

    <!-- Actions for the current multi-selection (hidden while nothing is selected) -->
    <div class="bulkbar" id="bulkbar" style="display:none">
      <span class="bulk-count" id="bulk-count">0 selected</span>
      <div class="grow"></div>
      <button class="btn" id="bulk-download" type="button">⬇ Download</button>
      <button class="btn secondary" id="bulk-move" type="button">Move to…</button>
      <button class="btn secondary" id="bulk-copy" type="button">Copy to…</button>
      <button class="btn secondary" id="bulk-share" type="button">Share</button>
      <button class="btn danger" id="bulk-delete" type="button">Delete</button>
      <button class="btn secondary" id="bulk-clear" type="button">Clear</button>
    </div>

    <div class="panel">
      <table>
        <thead>
          <tr>
            <th class="check-col">
              <input type="checkbox" id="select-all" title="Select all items in this folder" />
            </th>
            <th>Name</th>
            <th class="size-col">Size</th>
            <th class="date-col">Modified</th>
            <th class="actions-col"></th>
          </tr>
        </thead>
        <tbody id="file-rows">
          <tr><td colspan="5"><div class="empty">Loading…</div></td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Share dialog -->
  <div class="modal-backdrop" id="share-modal" style="display:none">
    <div class="modal">
      <h3 id="share-title">Share</h3>
      <div id="share-list"></div>
      <div class="share-form">
        <select id="share-username" aria-label="User to share with"></select>
        <div class="perm-checks" id="perm-checks">
          <label><input type="checkbox" value="1" checked /> Read</label>
          <label><input type="checkbox" value="2" checked /> Write</label>
          <label><input type="checkbox" value="4" checked /> Create</label>
          <label><input type="checkbox" value="8" checked /> Delete</label>
          <label><input type="checkbox" value="16" checked /> Share</label>
        </div>
        <button class="btn" id="share-add-btn" type="button">Share</button>
      </div>
      <div class="modal-footer">
        <button class="btn" id="share-close-btn" type="button">Close</button>
      </div>
    </div>
  </div>

  <!-- Move/Copy destination picker -->
  <div class="modal-backdrop" id="transfer-modal" style="display:none">
    <div class="modal pick-modal">
      <h3 id="transfer-title">Move to…</h3>
      <div class="pick-crumb" id="pick-crumb"></div>
      <div class="pick-list" id="pick-list"></div>
      <div class="modal-footer">
        <button class="btn secondary" id="transfer-cancel" type="button">Cancel</button>
        <button class="btn" id="transfer-confirm" type="button">Move here</button>
      </div>
    </div>
  </div>

  <!-- File preview (lightbox) -->
  <div class="modal-backdrop" id="preview-modal" style="display:none">
    <div class="modal preview-modal">
      <div class="preview-head">
        <span id="preview-name"></span>
        <div class="grow"></div>
        <a id="preview-newtab" href="#" target="_blank" rel="noopener">Open in new tab</a>
        <button class="btn secondary" id="preview-close-btn" type="button">Close</button>
      </div>
      <div class="preview-body" id="preview-body"></div>
      <div class="editor" id="editor-root" style="display:none">
        <div class="editor-toolbar">
          <span class="editor-status" id="editor-status"></span>
          <span class="editor-meta" id="editor-meta"></span>
          <div class="grow"></div>
          <button class="btn secondary" id="editor-md-toggle" type="button"
                  aria-pressed="false" style="display:none">Markdown</button>
          <button class="btn" id="editor-save-btn" type="button">Save</button>
        </div>
        <div class="editor-main">
          <textarea id="editor-text" spellcheck="false" wrap="off"></textarea>
          <div class="editor-md" id="editor-md" style="display:none"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/assets/app.js"></script>
</body>
</html>
