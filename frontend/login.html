<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="login.title">Sign in · fxcloud</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="logo">fx<span style="color:#22242a">cloud</span></div>
      <div class="tagline" data-i18n="login.tagline">Your files, synced and in one place.</div>

      <div class="lang-switch auth-lang" id="lang-switch" data-i18n-aria="lang.aria"></div>

      <div class="auth-tabs">
        <button id="tab-login" class="active" type="button" data-i18n="login.tab.signin">Sign in</button>
        <button id="tab-passkey" type="button" data-i18n="login.tab.passkey">Passkey</button>
        <button id="tab-register" type="button" data-i18n="login.tab.register">Create account</button>
      </div>

      <div id="error" class="error-msg"></div>

      <form id="auth-form" autocomplete="on">
        <div class="field">
          <label for="username" data-i18n="login.username">Username</label>
          <input id="username" name="username" type="text" required minlength="3" autocomplete="username" />
        </div>

        <div class="field" id="display-field" style="display:none">
          <label for="display_name" data-i18n="login.display">Display name</label>
          <input id="display_name" name="display_name" type="text" autocomplete="name" />
        </div>

        <div class="field">
          <label for="password" data-i18n="login.password">Password</label>
          <input id="password" name="password" type="password" required minlength="8" autocomplete="current-password" />
        </div>

        <button class="btn" id="submit-btn" type="submit" data-i18n="login.tab.signin">Sign in</button>
      </form>

      <form id="passkey-form" style="display:none" autocomplete="on">
        <div class="field">
          <label for="passkey-username" data-i18n="login.username">Username</label>
          <input id="passkey-username" name="username" type="text" required minlength="3"
                 autocomplete="username" />
        </div>
        <p class="auth-hint" data-i18n="login.passkeyHint">
          Sign in with the passkey registered for this account - the device
          asks for a PIN or biometrics instead of a password.
        </p>
        <button class="btn" id="passkey-btn" type="submit" data-i18n="login.passkeyBtn">Sign in with passkey</button>
      </form>
    </div>
  </div>

  <script src="/assets/i18n.js"></script>
  <script src="/assets/webauthn-client.js"></script>
  <script src="/assets/login.js"></script>
</body>
</html>
