name: test

# Everything a fresh `git clone` can run: the Rust unit tests, then the
# black-box suite that starts a throwaway instance and drives it over HTTP,
# WebDAV and the encryption endpoints. Green on every push and every pull
# request, so `main` never claims a test that CI did not actually execute.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # node runs the client-crypto harness and the JS syntax checks in
      # tests/suite.sh. Without it those checks fail loudly instead of being
      # skipped: an untested crypto path is worse than a red build.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Style gates before any test: rustfmt in seconds, clippy after its
      # first build. Both keep review honest - an unformatted chain or a new
      # lint stops the build instead of accumulating into drift.
      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The suite reads and updates the throwaway database directly to set up
      # quota and trash states that no HTTP endpoint would produce.
      - name: Install sqlite3 if the runner does not ship it
        run: |
          if ! command -v sqlite3 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sqlite3
          fi

      - name: Unit tests
        run: cargo test --workspace

      # Builds the debug binary itself (so its version badge always matches
      # Cargo.toml) and then runs every integration check.
      - name: Integration suite
        run: ./tests/suite.sh

  # The native client's build (concepts/android.md "Build and CI"): the
  # golden vectors through JNI on the host first, then the device .so and
  # the APK. S1's exit criterion is this job being green.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # AGP9 needs a modern JDK - the box builds with21, so does CI.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner ships an Android SDK (ANDROID_HOME is already set);
      # install exactly the packages cargo-ndk and AGP read from there.
      # setup-android@v3 is deliberately absent: it trips over the
      # runner's modern cmdline-tools ("Failed to find package 'tools'").
      - name: SDK packages (platform, build-tools, NDK)
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" \
            "build-tools;35.0.0" "ndk;29.0.14206865"

      - name: cargo-ndk
        run: cargo install cargo-ndk

      # Host first: both committed fingerprint vectors through JNI.
      - name: Host .so and JUnit vectors
        run: |
          cargo build -p fxjni
          cd android && ./gradlew test --no-daemon

      - name: Device .so (aarch64)
        run: cargo ndk -t arm64-v8a -P 26 build -p fxjni --release -o android/app/src/main/jniLibs

      - name: APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fxcloud-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile is what INSTALL.md tells users to build; a red job
      # here means those published instructions stopped working.
      - name: Build the image
        run: docker build -t fxcloud:ci .
